[project]
name = "gazera"
version = "0.1.0"
description = "Arabic-first LLM system with training, RAG, serving, and eval"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Gazera Labs"}]
keywords = ["arabic", "llm", "nlp", "rag", "qwen", "fine-tuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "accelerate>=0.33.0",
  "bitsandbytes>=0.43.1",
  "datasets>=2.20.0",
  "datasketch>=1.6.5",
  "fastapi>=0.111.0",
  "numpy>=1.26.4",
  "pandas>=2.2.2",
  "peft>=0.11.1",
  "pydantic>=2.7.4",
  "pypdf>=4.2.0",
  "pyyaml>=6.0.1",
  "qdrant-client>=1.10.1",
  "requests>=2.32.3",
  "safetensors>=0.4.3",
  "scikit-learn>=1.5.1",
  "sentence-transformers>=3.0.1",
  "torch>=2.3.1",
  "transformers>=4.43.3",
  "trl>=0.9.6",
  "uvicorn>=0.30.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.23.0",
  "black>=24.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
  "types-pyyaml>=6.0.0",
  "types-requests>=2.32.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = false
